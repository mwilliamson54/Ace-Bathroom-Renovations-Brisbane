<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs>
  <linearGradient id="wall-tiling" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d3dadd"/><stop offset="1" stop-color="#e6eaec"/>
  </linearGradient>
  <linearGradient id="floor-tiling" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b9c3c7"/><stop offset="1" stop-color="#b8c8ce"/>
  </linearGradient>
  <linearGradient id="glass-tiling" x1="0" y1="0" x2="1" y2="1">
