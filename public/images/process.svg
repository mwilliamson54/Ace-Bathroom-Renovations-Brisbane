<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs>
  <linearGradient id="wall-process" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d6e7ec"/><stop offset="1" stop-color="#e7f1f4"/>
  </linearGradient>
  <linearGradient id="floor-process" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#cfdde2"/><stop offset="1" stop-color="#b8c8ce"/>
  </linearGradient>
  <linearGradient id="glass-process" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".48"/><stop offset="1" stop-color="#dff2f8" stop-opacity=".15"/>
  </linearGradient>
  <linearGradient id="sky-process" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bfe3f2"/><stop offset="1" stop-color="#eef7f7"/>
  </linearGradient>
  <linearGradient id="stone-process" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7fbfc"/><stop offset="1" stop-color="#e9f0f2"/>
  </linearGradient>
  <filter id="shadow-process" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0d3b47" flood-opacity=".16"/>
  </filter>
  <filter id="soft-process" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
  <pattern id="tile-process" width="120" height="76" patternUnits="userSpaceOnUse">
    <rect width="120" height="76" fill="none"/>
    <path d="M0 0H120M0 76H120M0 0V76M120 0V76" stroke="#5f8894" stroke-opacity=".16" stroke-width="2"/>
  </pattern>
</defs>
<rect width="1600" height="900" fill="#eef5f6"/>
