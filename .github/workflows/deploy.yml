name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build, test and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build
        run: npm run build
        env:
          # Repository variable, not a secret. Set it to the host that actually serves
          # the site (for example the *.pages.dev URL) until the production domain is
          # attached. Leave it unset to build against https://acebathroomrenovationsbrisbane.com.
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}

      - name: Quality gate
        run: npm run check

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is empty"
            exit 1
          fi
          probe() {
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$1")
            echo "$2 -> HTTP $code"
          }
          probe https://api.cloudflare.com/client/v4/user/tokens/verify "tokens/verify"
          probe https://api.cloudflare.com/client/v4/accounts "accounts (list)"
          probe "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ace-bathroom-renovations-brisbane" "pages project"
          echo "runner egress IP: $(curl -s https://api.ipify.org)"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.153.0

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "token length: ${#CLOUDFLARE_API_TOKEN}"
          echo "account id: ${CLOUDFLARE_ACCOUNT_ID}"
          npx wrangler whoami
          npx wrangler pages deploy dist \
            --project-name ace-bathroom-renovations-brisbane \
            --branch main \
            --commit-dirty=true
