name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build, test and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: npm run build
        env:
          # Repository variable, not a secret. Set it to the host that actually serves
          # the site (for example the *.pages.dev URL) until the production domain is
          # attached. Leave it unset to build against https://acebathroomrenovationsbrisbane.com.
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}

      - name: Quality gate
        run: npm run check

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ace-bathroom-renovations-brisbane --branch main --commit-dirty=true
